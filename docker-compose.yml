# Runs the whole HTF in containers on one machine, with the same images used on AWS.
# The 16 Fog nodes run in a single container (they still talk only over the network).
#
#   deploy/extract-users.sh 4005        # dataset rows of the simulated user (once)
#   docker compose up --build
#   open http://localhost:8501
#
# Only the database, for a local run with Maven (TMS, Fog and Edge in terminals):
#   docker compose up -d postgres
services:
  # PostgreSQL 16 + PostGIS. The default image is multi-architecture (Apple Silicon runs it
  # natively); the official postgis/postgis:16-3.4 also works (emulated on ARM64).
  postgres:
    image: ${HTF_POSTGIS_IMAGE:-imresamu/postgis:16-3.4-alpine3.21}
    environment:
      POSTGRES_DB: htf
      POSTGRES_USER: htf
      POSTGRES_PASSWORD: htf
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U htf -d htf"]
      interval: 5s
      retries: 20

  tms:
    build: cloud/tms
    ports: ["8080:8080"]
    environment:
      HTF_TMS_DB_URL: jdbc:postgresql://postgres:5432/htf
      HTF_TMS_DB_USER: htf
      HTF_TMS_DB_PASSWORD: htf
    depends_on:
      postgres: { condition: service_healthy }

  fog:
    build: fog
    environment:
      HTF_FOG_HOST: fog
      HTF_FOG_SEED: http://fog:9001
      HTF_TMS_URL: http://tms:8080
    volumes: ["./store-and-forward-queue:/app/store-and-forward-queue", "./fog/metrics:/app/metrics"]
    depends_on: [tms]

  cmp:
    build: cloud/mobility-platform
    environment:
      HTF_TMS_URL: http://tms:8080
    ports: ["8501:8501"]
    depends_on: [tms]

  edge:
    build: edge
    environment:
      HTF_USER: "4005"
      HTF_DAY: "20"
      HTF_ENTRY_BROKER: tcp://fog:1901
      HTF_START_DELAY_S: "20"
      HTF_CONNECT_RETRY_S: "120"
    depends_on: [fog]

volumes:
  pgdata:   # the database survives docker compose down (down -v deletes it)
